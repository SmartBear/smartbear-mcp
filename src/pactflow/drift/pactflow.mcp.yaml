  - name: contract-testing_get_pacts_for_verification
    title: 'Contract Testing: Get Pacts for Verification'
    description: |-
      Retrieve the pacts that a provider should verify, based on consumer version selectors and WIP/pending pact configuration.

      **Toolset:** Contracts

      **Parameters:**
      - providerName (string) *required*: Name of the provider to get pacts for
      - consumerVersionSelectors (array): Selectors specifying which consumer versions to include
      - includePendingStatus (boolean): Include the pending status in the results
      - includeWipPactsSince (string): Include WIP pacts published since this date (ISO 8601)
      - providerVersionBranch (string): Branch of the provider version being verified
      - providerVersionTags (array): Tags for the provider version being verified
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        providerName:
          type: string
          description: Name of the provider to get pacts for
        consumerVersionSelectors:
          description: Selectors specifying which consumer versions to include
          type: array
          items:
            type: object
            properties:
              branch:
                description: Consumer branch name
                type: string
              consumer:
                description: Consumer name
                type: string
              deployed:
                description: Include versions that are currently deployed
                type: boolean
              deployedOrReleased:
                description: Include versions that are currently deployed or released
                type: boolean
              environment:
                description: Environment name
                type: string
              fallbackBranch:
                description: Fallback branch if primary branch doesn't exist
                type: string
              latest:
                description: Select only the latest version
                type: boolean
              mainBranch:
                description: Select versions from the consumer's main branch
                type: boolean
              matchingBranch:
                description: Select versions from the branch that matches the provider branch
                type: boolean
              released:
                description: Include versions that are currently released
                type: boolean
              tag:
                description: Tag name (legacy, prefer branch)
                type: string
        includePendingStatus:
          description: Include the pending status in the results
          type: boolean
        includeWipPactsSince:
          description: Include WIP pacts published since this date (ISO 8601)
          type: string
        providerVersionBranch:
          description: Branch of the provider version being verified
          type: string
        providerVersionTags:
          description: Tags for the provider version being verified
          type: array
          items:
            type: string
      required:
        - providerName
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        _embedded:
          type: object
          properties:
            pacts:
              type: array
              items:
                $ref: '#/$defs/VerifiablePact'
          additionalProperties: {}
        _links:
          type: object
          properties:
            self:
              $ref: '#/$defs/EmbeddedLink'
          additionalProperties: {}
      additionalProperties: {}
      $defs:
        VerifiablePact:
          type: object
          properties:
            shortDescription:
              type: string
            verificationProperties:
              type: object
              properties:
                pending:
                  type: boolean
                notices:
                  type: array
                  items:
                    type: object
                    properties:
                      when:
                        type: string
                      text:
                        type: string
                    additionalProperties: {}
                wip:
                  type: boolean
              additionalProperties: {}
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
          additionalProperties: {}
          id: VerifiablePact
        EmbeddedLink:
          type: object
          properties:
            href:
              type: string
            name:
              type: string
            templated:
              type: boolean
            title:
              type: string
          additionalProperties: {}
          id: EmbeddedLink
    annotations:
      title: 'Contract Testing: Get Pacts for Verification'
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
