    title: 'Contract Testing: Update Webhook'
    description: |-
      Update an existing webhook's configuration.

      **Toolset:** Webhooks

      **Parameters:**
      - webhookId (string) *required*: UUID of the webhook to update
      - description (string): Human-readable description
      - events (array): Events that trigger this webhook
      - request (object): HTTP request to send when triggered
      - consumer (object): Restrict to a specific consumer
      - provider (object): Restrict to a specific provider
      - enabled (boolean): Whether the webhook is enabled
      - teamUuid (string): UUID of the owning team
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        webhookId:
          type: string
          description: UUID of the webhook to update
        description:
          description: Human-readable description
          type: string
        events:
          description: Events that trigger this webhook
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Event name (e.g. 'contract_content_changed', 'provider_verification_published')
            required:
              - name
        request:
          description: HTTP request to send when triggered
          type: object
          properties:
            method:
              type: string
              const: POST
              description: HTTP method (must be POST)
            url:
              type: string
              format: uri
              description: URL to send the webhook request to
            body:
              description: Request body to send
            headers:
              description: HTTP headers to include
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
            username:
              description: Username for basic auth
              type: string
            password:
              description: Password for basic auth
              type: string
          required:
            - method
            - url
        consumer:
          description: Restrict to a specific consumer
          anyOf:
            - type: object
              properties:
                name:
                  type: string
              required:
                - name
            - type: 'null'
        provider:
          description: Restrict to a specific provider
          anyOf:
            - type: object
              properties:
                name:
                  type: string
              required:
                - name
            - type: 'null'
        enabled:
          description: Whether the webhook is enabled
          type: boolean
        teamUuid:
          description: UUID of the owning team
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
      required:
        - webhookId
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        consumer:
          type: object
          properties:
            name:
              type: string
          additionalProperties: {}
        description:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
            additionalProperties: {}
        provider:
          type: object
          properties:
            name:
              type: string
          additionalProperties: {}
        request:
          type: object
          properties:
            body: {}
            headers:
              type: object
              properties: {}
              additionalProperties: {}
              description: Request headers. Values support template expressions and auth helper functions.
            method:
              type: string
            password:
              type: string
            url:
              type: string
            username:
              type: string
          additionalProperties: {}
        teamUuid:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
