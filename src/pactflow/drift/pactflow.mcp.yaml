  - name: contract-testing_review_pact_tests
    title: 'Contract Testing: Review Pact Tests'
    description: |-
      Review Pact tests using PactFlow AI. You can provide the following inputs: (1) Pact tests to be reviewed along with metadata

      **Toolset:** Review Pact Tests

      **Parameters:**
      - pactTests (object) *required*: Primary pact tests that needs to be refined.
      - code (array): Collection of source code files to analyze and extract API interactions from. Include client code, data models, existing tests, or any code that makes API calls
      - userInstructions (string): Optional free-form instructions that provide additional context or specify areas of focus during the refinement process of the Pact test.
      - errorMessages (array): Optional error output from failed contract test runs. These can be used to better understand the context or failures observed and guide the recommendations toward resolving specific issues.
      - openapi (any)
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        pactTests:
          type: object
          properties:
            filename:
              description: Filename (helps identify file type and context)
              type: string
            language:
              description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
              type: string
            body:
              type: string
              description: Complete file contents - client code, models, test files, etc.
          required:
            - body
          description: Primary pact tests that needs to be refined.
        code:
          type: array
          items:
            type: object
            properties:
              filename:
                description: Filename (helps identify file type and context)
                type: string
              language:
                description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
                type: string
              body:
                type: string
                description: Complete file contents - client code, models, test files, etc.
            required:
              - body
          description: Collection of source code files to analyze and extract API interactions from. Include client code, data models, existing tests, or any code that makes API calls
        userInstructions:
          type: string
          description: Optional free-form instructions that provide additional context or specify areas of focus during the refinement process of the Pact test.
        errorMessages:
          type: array
          items:
            type: string
          description: Optional error output from failed contract test runs. These can be used to better understand the context or failures observed and guide the recommendations toward resolving specific issues.
        openapi:
          type: object
          properties:
            document:
              type: object
              properties:
                openapi:
                  description: For OpenAPI version (e.g., '3.0.0')
                  type: string
                swagger:
                  type: string
                  description: For OpenAPI documents version 2.x (e.g., '2.0')
                paths:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  description: OpenAPI paths object containing all API endpoints
                components:
                  description: OpenAPI components section (schemas, responses, etc.)
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
              required:
                - paths
              additionalProperties: {}
              description: The OpenAPI document describing the API being tested. if document is not provided, don't add the field if remoteOpenAPIDocument is provided.
            matcher:
              description: 'REQUIRED: Matcher to specify which endpoints from the OpenAPI document to generate tests for. At least one matcher field must be provided'
              type: object
              properties:
                path:
                  description: 'Path pattern to match specific endpoints (e.g., ''/users/{id}'', ''/users/*'', ''/users/**''). Supports glob patterns: ? (single char), * (excluding /), ** (including /)'
                  type: string
                methods:
                  description: HTTP methods to include (e.g., ['GET', 'POST']). If not specified, all methods are matched
                  type: array
                  items:
                    type: string
                    enum:
                      - GET
                      - PUT
                      - POST
                      - DELETE
                      - OPTIONS
                      - HEAD
                      - PATCH
                      - TRACE
                statusCodes:
                  description: Response status codes to include (e.g., [200, '2XX', 404]). Use 'X' as wildcard (e.g., '2XX' for 200-299). Defaults to successful codes (2XX)
                  type: array
                  items:
                    anyOf:
                      - type: number
                      - type: string
                operationId:
                  description: OpenAPI operation ID to match (e.g., 'getUserById', 'get*'). Supports glob patterns
                  type: string
            remoteDocument:
              description: The remote OpenAPI document to use for the review/generation in case openapi document is not provided. If provided do not include the document field under openapi.
              type: object
              properties:
                authToken:
                  type: string
                  description: Auth Bearer Token if the OpenAPI spec requires authentication.
                authScheme:
                  default: Bearer
                  type: string
                  description: Authentication scheme (e.g., 'Bearer', 'Basic'). Default scheme passed should be Bearer if authToken is specified and this field is not set.
                url:
                  type: string
                  format: uri
                  description: URL of the remote OpenAPI document.
          description: If provided, the OpenAPI document which describes the API being tested and is accompanied by a matcher which will be used to identify the interactions in the OpenAPI document which are relevant to the Pact refinement process.
      required:
        - pactTests
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        recommendations:
          type: array
          items:
            type: object
            properties:
              recommendation:
                type: string
              diff:
                anyOf:
                  - type: string
                  - type: 'null'
              confidence:
                anyOf:
                  - type: number
                  - type: 'null'
            required:
              - recommendation
            additionalProperties: {}
        requiresPromptExecution:
          type: boolean
