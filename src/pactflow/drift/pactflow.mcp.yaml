  - name: contract-testing_matrix
    title: 'Contract Testing: Matrix'
    description: |-
      Retrieve the comprehensive contract verification matrix that shows the relationship between consumer and provider versions, their associated pact files, and verification results stored in the Pact Broker or Pactflow. The matrix provides detailed visibility into which consumer and provider versions have been successfully verified against each other, and highlights failures with detailed information about the cause.

      **Toolset:** Matrix

      **Parameters:**
      - latestby (string): This property removes the rows for the overridden pacts/verifications from the results. The options are cvp (show only the latest row for each consumer version and provider) and cvpv (show only the latest row each consumer version and provider version). For a can-i-deploy query with one selector, it should be set to cvp. For a can-i-deploy query with two selectors, it should be set to cvpv.
      - limit (number): The limit on the number of results to return (1-1000, default: 100) (default: 100)
      - q (array) *required*

      **Use Cases:** 1. Quickly identify which consumer and provider version combinations have passed or failed verification. 2. Diagnose and investigate why a particular consumer-provider verification failed. 3. Visualize the overall contract compatibility across two pacticipants / services. 4. Perform advanced queries using selectors to understand compatibility within specific branches, environments, or version ranges. 5. Support informed deployment decisions by answering 'can I deploy version X of this service to production?' 6. Expose contract verification details to non-frequent API users in a more accessible format.
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        latestby:
          description: This property removes the rows for the overridden pacts/verifications from the results. The options are cvp (show only the latest row for each consumer version and provider) and cvpv (show only the latest row each consumer version and provider version). For a can-i-deploy query with one selector, it should be set to cvp. For a can-i-deploy query with two selectors, it should be set to cvpv.
          type: string
        limit:
          description: 'The limit on the number of results to return (1-1000, default: 100)'
          default: 100
          type: number
          minimum: 1
          maximum: 1000
        q:
          minItems: 1
          maxItems: 2
          type: array
          items:
            type: object
            properties:
              pacticipant:
                type: string
                description: Name of the pacticipant (application)
              version:
                description: Version number
                type: string
              branch:
                description: Name of the pacticipant version branch
                type: string
              environment:
                description: The name of the environment that the pacticipant version is deployed to
                type: string
              latest:
                description: Used in conjunction with other properties to indicate whether the selector is describing the latest version from a branch/with a tag/for a pacticipant, or all of them. Note that when used with tags, the 'latest' is calculated using the creation date of the pacticipant version, NOT the creation date of the tag.
                type: boolean
              tag:
                description: The name of the pacticipant version tag (superseded by branch and environments)
                type: string
              mainBranch:
                description: Whether or not the version(s) described are from the main branch of the pacticipant, as set in the mainBranch property of the pacticipant resource.
                type: boolean
            required:
              - pacticipant
      required:
        - q
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        matrix:
          type: array
          items:
            type: object
            properties:
              consumer:
                $ref: '#/$defs/MatrixPacticipant'
              pact:
                type: object
                properties:
                  createdAt:
                    type: string
                  _links:
                    type: object
                    properties:
                      self:
                        $ref: '#/$defs/EmbeddedLink'
                      pfi:ui:
                        $ref: '#/$defs/EmbeddedLink'
                    additionalProperties: {}
                additionalProperties: {}
              provider:
                $ref: '#/$defs/MatrixPacticipant'
              verificationResult:
                anyOf:
                  - type: object
                    properties:
                      success:
                        type: boolean
                      verifiedAt:
                        type: string
                      _links:
                        type: object
                        properties:
                          self:
                            $ref: '#/$defs/EmbeddedLink'
                          pfi:ui:
                            $ref: '#/$defs/EmbeddedLink'
                        additionalProperties: {}
                    additionalProperties: {}
                  - type: 'null'
            additionalProperties: {}
        notices:
          type: array
          items:
            $ref: '#/$defs/Notice'
        summary:
          type: object
          properties:
            deployable:
              anyOf:
                - type: boolean
                - type: 'null'
              description: The property that indicates whether or not the pacticipant version is safe to deploy.
            failed:
              type: number
            reason:
              type: string
            success:
              type: number
            unknown:
              type: number
          additionalProperties: {}
      additionalProperties: {}
      $defs:
        MatrixPacticipant:
          type: object
          properties:
            name: {}
            version:
              anyOf:
                - $ref: '#/$defs/MatrixPacticipantVersion'
                - type: 'null'
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
          additionalProperties: {}
          id: MatrixPacticipant
        MatrixPacticipantVersion:
          type: object
          properties:
            branch:
              description: Use branchVersions
            branches:
              type: array
              items:
                $ref: '#/$defs/EmbeddedBranchVersion'
              description: Use branchVersions
            branchVersions:
              type: array
              items:
                $ref: '#/$defs/EmbeddedBranchVersion'
            environments:
              type: array
              items:
                $ref: '#/$defs/EmbeddedEnvironment'
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
            number:
              type: string
            tags:
              type: array
              items:
                type: object
                properties:
                  latest:
                    type: boolean
                  name:
                    type: string
                  _links:
                    type: object
                    properties:
                      self:
                        $ref: '#/$defs/EmbeddedLink'
                    additionalProperties: {}
                additionalProperties: {}
          additionalProperties: {}
          id: MatrixPacticipantVersion
        EmbeddedBranchVersion:
          type: object
          properties:
            name:
              type: string
            latest:
              type: boolean
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
          additionalProperties: {}
          id: EmbeddedBranchVersion
        EmbeddedLink:
          type: object
          properties:
            href:
              type: string
            name:
              type: string
            templated:
              type: boolean
            title:
              type: string
          additionalProperties: {}
          id: EmbeddedLink
        EmbeddedEnvironment:
          type: object
          properties:
            displayName:
              type: string
            name:
              type: string
            production:
              type: boolean
            uuid:
              type: string
            createdAt:
              type: string
            updatedAt:
              type: string
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
          additionalProperties: {}
          id: EmbeddedEnvironment
        Notice:
          type: object
          properties:
            text:
              type: string
            type:
              anyOf:
                - type: string
                  const: info
                - type: string
                  const: debug
                - type: string
                  const: warning
                - type: string
                  const: prompt
                - type: string
                  const: success
                - type: string
                  const: error
          additionalProperties: {}
          id: Notice
    annotations:
      title: 'Contract Testing: Matrix'
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
