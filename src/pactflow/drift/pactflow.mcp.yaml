  - name: contract-testing_generate_pact_tests
    title: 'Contract Testing: Generate Pact Tests'
    description: |-
      Generate Pact tests using PactFlow AI. You can provide one or more of the following input types: (1) request/response pairs for specific interactions, (2) code files to analyze and extract interactions from, and/or (3) OpenAPI document to generate tests for specific endpoints. When providing an OpenAPI document, a matcher is required to specify which endpoints to generate tests for.

      **Toolset:** Generate Pact Tests

      **Parameters:**
      - language (enum): Target language for the generated Pact tests. If not provided, will be inferred from other inputs.
      - requestResponse (object): Direct request/response pair for a specific interaction. Use this when you have concrete examples of API requests and responses
      - code (array): Collection of source code files to analyze and extract API interactions from. Include client code, data models, existing tests, or any code that makes API calls
      - openapi (any)
      - additionalInstructions (string): Optional free-form instructions to guide the generation process (e.g., 'Focus on error scenarios', 'Include authentication headers', 'Use specific test framework patterns')
      - testTemplate (object): Optional test template to use as a basis for generation. Helps ensure generated tests follow your specific patterns, frameworks, and coding standards
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        language:
          description: Target language for the generated Pact tests. If not provided, will be inferred from other inputs.
          type: string
          enum:
            - javascript
            - typescript
            - java
            - golang
            - dotnet
            - kotlin
            - swift
            - php
            - python
        requestResponse:
          type: object
          properties:
            request:
              type: object
              properties:
                filename:
                  description: Filename (helps identify file type and context)
                  type: string
                language:
                  description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
                  type: string
                body:
                  type: string
                  description: Complete file contents - client code, models, test files, etc.
              required:
                - body
            response:
              type: object
              properties:
                filename:
                  description: Filename (helps identify file type and context)
                  type: string
                language:
                  description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
                  type: string
                body:
                  type: string
                  description: Complete file contents - client code, models, test files, etc.
              required:
                - body
          required:
            - request
            - response
          description: Direct request/response pair for a specific interaction. Use this when you have concrete examples of API requests and responses
        code:
          description: Collection of source code files to analyze and extract API interactions from. Include client code, data models, existing tests, or any code that makes API calls
          type: array
          items:
            type: object
            properties:
              filename:
                description: Filename (helps identify file type and context)
                type: string
              language:
                description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
                type: string
              body:
                type: string
                description: Complete file contents - client code, models, test files, etc.
            required:
              - body
        openapi:
          type: object
          properties:
            document:
              type: object
              properties:
                openapi:
                  description: For OpenAPI version (e.g., '3.0.0')
                  type: string
                swagger:
                  type: string
                  description: For OpenAPI documents version 2.x (e.g., '2.0')
                paths:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
                  description: OpenAPI paths object containing all API endpoints
                components:
                  description: OpenAPI components section (schemas, responses, etc.)
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: object
                    propertyNames:
                      type: string
                    additionalProperties: {}
              required:
                - paths
              additionalProperties: {}
              description: The OpenAPI document describing the API being tested. if document is not provided, don't add the field if remoteOpenAPIDocument is provided.
            matcher:
              description: 'REQUIRED: Matcher to specify which endpoints from the OpenAPI document to generate tests for. At least one matcher field must be provided'
              type: object
              properties:
                path:
                  description: 'Path pattern to match specific endpoints (e.g., ''/users/{id}'', ''/users/*'', ''/users/**''). Supports glob patterns: ? (single char), * (excluding /), ** (including /)'
                  type: string
                methods:
                  description: HTTP methods to include (e.g., ['GET', 'POST']). If not specified, all methods are matched
                  type: array
                  items:
                    type: string
                    enum:
                      - GET
                      - PUT
                      - POST
                      - DELETE
                      - OPTIONS
                      - HEAD
                      - PATCH
                      - TRACE
                statusCodes:
                  description: Response status codes to include (e.g., [200, '2XX', 404]). Use 'X' as wildcard (e.g., '2XX' for 200-299). Defaults to successful codes (2XX)
                  type: array
                  items:
                    anyOf:
                      - type: number
                      - type: string
                operationId:
                  description: OpenAPI operation ID to match (e.g., 'getUserById', 'get*'). Supports glob patterns
                  type: string
            remoteDocument:
              description: The remote OpenAPI document to use for the review/generation in case openapi document is not provided. If provided do not include the document field under openapi.
              type: object
              properties:
                authToken:
                  type: string
                  description: Auth Bearer Token if the OpenAPI spec requires authentication.
                authScheme:
                  default: Bearer
                  type: string
                  description: Authentication scheme (e.g., 'Bearer', 'Basic'). Default scheme passed should be Bearer if authToken is specified and this field is not set.
                url:
                  type: string
                  format: uri
                  description: URL of the remote OpenAPI document.
          description: If provided, the OpenAPI document which describes the API being tested and is accompanied by a matcher which will be used to identify the interactions in the OpenAPI document which are relevant to the Pact refinement process.
        additionalInstructions:
          description: Optional free-form instructions to guide the generation process (e.g., 'Focus on error scenarios', 'Include authentication headers', 'Use specific test framework patterns')
          type: string
        testTemplate:
          description: Optional test template to use as a basis for generation. Helps ensure generated tests follow your specific patterns, frameworks, and coding standards
          type: object
          properties:
            filename:
              description: Filename (helps identify file type and context)
              type: string
            language:
              description: Programming language (e.g., 'javascript', 'java', 'python') for better analysis
              type: string
            body:
              type: string
              description: Complete file contents - client code, models, test files, etc.
          required:
            - body
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        id:
          anyOf:
            - type: string
            - type: 'null'
        code:
          type: string
        language:
          type: string
        requiresPromptExecution:
          type: boolean
          const: true
        prompt:
          type: string
        instructions:
          type: string
      additionalProperties: {}
    annotations:
      title: 'Contract Testing: Generate Pact Tests'
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
  - name: contract-testing_get_audit_log
    title: 'Contract Testing: Get Audit Log'
    description: |-
      Retrieve the audit log of events in the workspace.

      **Toolset:** Audit

      **Parameters:**
      - since (string): Only include events at or after this ISO 8601 timestamp
      - userUuid (string): Filter events by PactFlow user UUID
      - type (string): Filter events by type (e.g. 'pact_publication')
      - sort (string): Sort order: '+timestamp' (asc, default) or '-timestamp' (desc)
      - from (string): Start result set from this audit event UUID (keyset pagination)
      - pageNumber (number): Page number (default: 1)
      - pageSize (number): Results per page (max 100) (default: 5)

      **Use Cases:** 1. Review recent changes to pacticipants, webhooks, or secrets 2. Investigate who published a specific pact or verification 3. Filter events by user or event type for compliance reporting 4. Track deployment recording activity across environments
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        since:
          description: Only include events at or after this ISO 8601 timestamp
          type: string
        userUuid:
          description: Filter events by PactFlow user UUID
          type: string
          format: uuid
          pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
        type:
          description: Filter events by type (e.g. 'pact_publication')
          type: string
        sort:
          description: 'Sort order: ''+timestamp'' (asc, default) or ''-timestamp'' (desc)'
          type: string
        from:
          description: Start result set from this audit event UUID (keyset pagination)
          type: string
        pageNumber:
          description: Page number
          default: 1
          type: integer
          minimum: 1
          maximum: 9007199254740991
        pageSize:
          description: Results per page (max 100)
          default: 5
          type: integer
          minimum: 1
          maximum: 100
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        events:
          type: array
          items:
            anyOf:
              - $ref: '#/$defs/HttpAuditEvent'
              - $ref: '#/$defs/AuthFailureEvent'
              - $ref: '#/$defs/CustomEvent'
        _links:
          type: object
          properties:
            self:
              $ref: '#/$defs/EmbeddedLink'
            next:
              type: object
              properties:
                href:
                  type: string
                name:
                  type: string
                templated:
                  type: boolean
                title:
                  type: string
              additionalProperties: {}
            previous:
              type: object
              properties:
                href:
                  type: string
                name:
                  type: string
                templated:
                  type: boolean
                title:
                  type: string
              additionalProperties: {}
          additionalProperties: {}
        page:
          type: object
          properties:
            number:
              type: number
            size:
              type: number
            totalElements:
              type: number
            totalPages:
              type: number
          additionalProperties: {}
      additionalProperties: {}
      $defs:
        HttpAuditEvent:
          type: object
          properties:
            name:
              type: string
            payload:
              $ref: '#/$defs/HttpRequestPayload'
            response:
              $ref: '#/$defs/HttpAuditResponse'
            timestamp:
              type: string
            tokenUuid:
              type: string
            type:
              type: string
            username:
              type: string
            userEmail:
              type: string
            userUuid:
              type: string
            uuid:
              type: string
          additionalProperties: {}
          id: HttpAuditEvent
        HttpRequestPayload:
          type: object
          properties:
            method:
              type: string
            path:
              type: string
            queryString:
              type: string
            referer:
              anyOf:
                - type: string
                - type: 'null'
            remoteHost:
              anyOf:
                - type: string
                - type: 'null'
            remoteAddress:
              type: string
            requestId:
              type: string
            userAgent:
              type: string
          additionalProperties: {}
          id: HttpRequestPayload
        HttpAuditResponse:
          type: object
          properties:
            status:
              type: number
          additionalProperties: {}
          id: HttpAuditResponse
        AuthFailureEvent:
          type: object
          properties:
            payload:
              $ref: '#/$defs/HttpRequestPayload'
            timestamp:
              type: string
            tokenUuid:
              type: string
            type:
              type: string
            username:
              type: string
            userEmail:
              type: string
            userUuid:
              type: string
            uuid:
              type: string
          additionalProperties: {}
          id: AuthFailureEvent
        CustomEvent:
          type: object
          properties:
            payload:
              $ref: '#/$defs/CustomPayload'
            timestamp:
              type: string
            tokenUuid:
              type: string
            type:
              type: string
            username:
              type: string
            userEmail:
              type: string
            userUuid:
              type: string
            uuid:
              type: string
          additionalProperties: {}
          id: CustomEvent
        CustomPayload:
          type: object
          properties:
            identityProviderId:
              type: string
          additionalProperties: {}
          id: CustomPayload
        EmbeddedLink:
          type: object
          properties:
            href:
              type: string
            name:
              type: string
            templated:
              type: boolean
            title:
              type: string
          additionalProperties: {}
          id: EmbeddedLink
    annotations:
      title: 'Contract Testing: Get Audit Log'
      readOnlyHint: true
      destructiveHint: false
      idempotentHint: true
      openWorldHint: false
