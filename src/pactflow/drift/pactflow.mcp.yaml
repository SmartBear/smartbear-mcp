  - name: contract-testing_create_webhook
    title: 'Contract Testing: Create Webhook'
    description: |-
      Create a new webhook to trigger on contract events.

      **Toolset:** Webhooks

      **Parameters:**
      - description (string) *required*: Human-readable description of the webhook
      - events (array) *required*: Events that trigger this webhook
      - request (object) *required*: HTTP request to send when triggered
      - consumer (object): Restrict to a specific consumer (omit for all)
      - provider (object): Restrict to a specific provider (omit for all)
      - enabled (boolean): Whether the webhook is enabled (default: true)
      - teamUuid (string): UUID of the owning team (null for global)
    inputSchema:
      type: object
      $schema: https://json-schema.org/draft/2020-12/schema
      properties:
        description:
          type: string
          description: Human-readable description of the webhook
        events:
          minItems: 1
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                description: Event name (e.g. 'contract_content_changed', 'provider_verification_published')
            required:
              - name
          description: Events that trigger this webhook
        request:
          type: object
          properties:
            method:
              type: string
              const: POST
              description: HTTP method (must be POST)
            url:
              type: string
              format: uri
              description: URL to send the webhook request to
            body:
              description: Request body to send
            headers:
              description: HTTP headers to include
              type: object
              propertyNames:
                type: string
              additionalProperties:
                type: string
            username:
              description: Username for basic auth
              type: string
            password:
              description: Password for basic auth
              type: string
          required:
            - method
            - url
          description: HTTP request to send when triggered
        consumer:
          description: Restrict to a specific consumer (omit for all)
          type: object
          properties:
            name:
              type: string
          required:
            - name
        provider:
          description: Restrict to a specific provider (omit for all)
          type: object
          properties:
            name:
              type: string
          required:
            - name
        enabled:
          default: true
          description: Whether the webhook is enabled
          type: boolean
        teamUuid:
          description: UUID of the owning team (null for global)
          anyOf:
            - type: string
              format: uuid
              pattern: ^([0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}|00000000-0000-0000-0000-000000000000|ffffffff-ffff-ffff-ffff-ffffffffffff)$
            - type: 'null'
      required:
        - description
        - events
        - request
    outputSchema:
      $schema: https://json-schema.org/draft/2020-12/schema
      type: object
      properties:
        consumer:
          type: object
          properties:
            name:
              type: string
          additionalProperties: {}
        description:
          type: string
        enabled:
          type: boolean
        events:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
            additionalProperties: {}
        provider:
          type: object
          properties:
            name:
              type: string
          additionalProperties: {}
        request:
          type: object
          properties:
            body: {}
            headers:
              type: object
              properties: {}
              additionalProperties: {}
              description: Request headers. Values support template expressions and auth helper functions.
            method:
              type: string
            password:
              type: string
            url:
              type: string
            username:
              type: string
          additionalProperties: {}
        teamUuid:
          anyOf:
            - type: string
            - type: 'null'
        createdAt:
          type: string
        updatedAt:
          type: string
        uuid:
          type: string
        _embedded:
          type: object
          properties:
            team:
              $ref: '#/$defs/EmbeddedTeam'
          additionalProperties: {}
        _links:
          type: object
          properties:
            self:
              $ref: '#/$defs/EmbeddedLink'
            pb:execute:
              $ref: '#/$defs/EmbeddedLink'
            pb:consumer:
              $ref: '#/$defs/EmbeddedLink'
            pb:provider:
              $ref: '#/$defs/EmbeddedLink'
            pb:pact-webhooks:
              $ref: '#/$defs/EmbeddedLink'
            pb:webhooks:
              $ref: '#/$defs/EmbeddedLink'
          additionalProperties: {}
      additionalProperties: {}
      $defs:
        EmbeddedTeam:
          type: object
          properties:
            isDefault:
              type: boolean
            name:
              type: string
            uuid:
              type: string
            _links:
              type: object
              properties:
                self:
                  $ref: '#/$defs/EmbeddedLink'
              additionalProperties: {}
          additionalProperties: {}
          id: EmbeddedTeam
        EmbeddedLink:
          type: object
          properties:
            href:
              type: string
            name:
              type: string
            templated:
              type: boolean
            title:
              type: string
          additionalProperties: {}
          id: EmbeddedLink
    annotations:
      title: 'Contract Testing: Create Webhook'
      readOnlyHint: false
      destructiveHint: false
      idempotentHint: false
      openWorldHint: false
